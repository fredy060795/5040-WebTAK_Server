name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Video server and ffmpeg for the video tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          MTX=$(grep -o 'mediamtxVersion = "[^"]*"' media.go | cut -d'"' -f2)
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/$MTX/mediamtx_${MTX}_linux_amd64.tar.gz" | tar xz -C /tmp mediamtx
      - name: Test
        env:
          WTS_MEDIAMTX: /tmp/mediamtx
        run: go test -race -count=1 ./...
      - name: Cross-compile (Windows, Raspberry Pi, macOS)
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
